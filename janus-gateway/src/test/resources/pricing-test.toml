[micronaut.application]
name = "janus"

[janus]
name = "janus"
version = "0.1.0-SNAPSHOT"

# binding fixture: the full [janus.pricing] block with kebab-case element keys
# (the M1 rule: array-of-tables element keys keep their raw spellings — underscores
# would silently null; pinned by ModelListBindingTest.underscorePricingKeysSilentlyNull).
# The second row carries the optional cache rates + a custom reserve factor; the first
# omits them (pins the "absent ⇒ null ⇒ factory substitutes 0/fallback" rule).
[janus.pricing]

[[janus.pricing.models]]
name = "deepseek-v4-flash"
input-per-1k = 0.00014
output-per-1k = 0.00028
default-max-tokens = 4096

[[janus.pricing.models]]
name = "deepseek-v4-pro"
input-per-1k = 0.14
output-per-1k = 0.28
cache-read-per-1k = 0.07
cache-creation-per-1k = 0.09
default-max-tokens = 8192
long-context-threshold = 200000
long-input-per-1k = 0.28
long-output-per-1k = 0.56
