[micronaut.application]
name = "janus"

[janus]
name = "janus"
version = "0.1.0-SNAPSHOT"

# binding fixture: the full [janus.store] block with kebab-case scalar keys
# (pinned by ModelListBindingTest.bindsStoreSectionToStoreConfig). The JDBC URL is
# NEVER in TOML — jdbc-url-env names the env var holding it. Values
# deliberately differ from the documented defaults so the test distinguishes bound
# values from the factory's DEFAULTS.
[janus.store]
type = "postgres"
jdbc-url-env = "JANUS_DB_URL"
user-env = "JANUS_DB_USER"
password-env = "JANUS_DB_PASS"
max-pool-size = 25
retention = 500
