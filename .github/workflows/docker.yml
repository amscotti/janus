# =============================================================================
# Docker image workflow.
#
# Jobs:
#   build          — on push to main + v* tags: build the amd64 image with
#                    BuildKit cache and boot-smoke it (/health). Never pushes.
#   verify-release — on v* tags ONLY: verify the tag matches all version
#                    sources, run the full Gradle gate, and execute the native
#                    PostgreSQL drill before any architecture can publish.
#   publish-*      — on v* tags ONLY after build + verify-release: build one
#                    native architecture (amd64 or arm64, no QEMU), boot-smoke
#                    that exact image, then push its tags to GHCR.
#   publish-manifest — merge the two verified architecture manifests.
#
# scaffold precedent: like the native CI job, this workflow cannot actually run
# until pushed to GitHub — the native startup target bullet "CI pipeline green end-to-end"
# records the same "needs push" caveat.
# =============================================================================
name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# build: read-only. publish needs packages:write to push to GHCR.
permissions:
  contents: read

jobs:
  build:
    name: Build image (linux/amd64, no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (digest-pinned)

      - name: Gradle distribution digest (wrapper integrity build-arg)
        # the image build runs ./gradlew INSIDE the builder stage, which
        # downloads the distribution there — fetch Gradle's official
        # gradle-<v>-bin.zip.sha256 and hand it to deploy/Dockerfile as a
        # build-arg so the in-build wrapper download is verified too.
        run: |
          test -x scripts/pin-gradle-digest.sh
          # NOT `echo "...=$(script)"`: a failing command substitution inside echo's
          # argument list does not trip bash -e — the step would stay green with an
          # empty SHA and the Dockerfile's -n guard would silently skip pinning (the
          # exact degradation pin-gradle-digest.sh's exit-1 contract forbids). An
          # assignment failure does fail the step.
          sha="$(scripts/pin-gradle-digest.sh --print)"
          echo "GRADLE_DIST_SHA256=$sha" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0 (digest-pinned)

      - name: Build image (BuildKit cache)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2 (digest-pinned)
        with:
          context: .
          file: deploy/Dockerfile
          # No registry push: the tag is local to the job (and the smoke step).
          tags: janus:ci-${{ github.sha }}
          build-args: |
            GRADLE_DIST_SHA256=${{ env.GRADLE_DIST_SHA256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false
          load: true # with push:false the image is NOT loaded into the local
                     # daemon unless load:true — the smoke step's `docker run`
                     # needs it present.

      # Container smoke: boot the image against the production runtime shape
      # (MICRONAUT_CONFIG_FILES mounted config + tmpfs /tmp + read-only) so the
      # /health gate exercises the same contract compose/k8s rely on. The
      # harness (scripts/smoke/docker/) owns the full admin/chat/postgres
      # smoke on arm64 hosts; this step is the amd64 boot gate.
      - name: Container smoke (/health)
        run: |
          docker run -d --name janus-smoke -p 8080:8080 \
            --read-only --tmpfs /tmp \
            -e MICRONAUT_CONFIG_FILES=/etc/janus/config.toml \
            -e JANUS_MASTER_KEY=ci-health-smoke \
            -v "$(pwd)/deploy/config/config.memory.toml:/etc/janus/config.toml:ro" \
            janus:ci-${{ github.sha }}
          trap 'docker rm -f janus-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health; then
              echo
              echo "container /health ok (attempt $i)"
              exit 0
            fi
            sleep 1
          done
          echo "container /health check failed"
          docker logs janus-smoke 2>&1 | tail -40
          exit 1

  verify-release:
    name: Release gate (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (digest-pinned)
      - name: Pin Gradle distribution digest
        run: |
          test -x scripts/pin-gradle-digest.sh
          scripts/pin-gradle-digest.sh
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1.6.4 (digest-pinned)
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'
          native-image-job-reports: 'true'
      - name: Grant wrapper permissions
        run: chmod +x gradlew
      - name: Verify tag matches every version source
        run: |
          test -x scripts/verify-release-version.sh
          scripts/verify-release-version.sh "${GITHUB_REF_NAME}"
      - name: Full build + native PostgreSQL release drill
        # The drill runs the full Gradle gate, nativeCompile, the two-node
        # Postgres contract, and the native Postgres boot/record assertion.
        run: bash scripts/smoke/store/run.sh --skip-regression

  publish-amd64:
    name: Publish linux/amd64 to GHCR (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify-release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (digest-pinned)

      - name: Gradle distribution digest (wrapper integrity build-arg)
        run: |
          test -x scripts/pin-gradle-digest.sh
          sha="$(scripts/pin-gradle-digest.sh --print)"
          echo "GRADLE_DIST_SHA256=$sha" >> "$GITHUB_ENV"

      # GHCR requires lowercase repository names; janus already is, but this
      # stays correct if the repo is ever renamed with capitals.
      - name: Image name (lowercased repo)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0 (digest-pinned)

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0 (digest-pinned)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags + labels, amd64-suffixed)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 (digest-pinned)
        with:
          images: ${{ env.IMAGE }}
          # v0.2.0 → :0.2.0-amd64, :0.2-amd64, :latest-amd64 — the arch-suffixed
          # tags are merged into the plain tags by publish-manifest below.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern=latest
          flavor: suffix=-amd64,onlatest=true

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2 (digest-pinned)
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GRADLE_DIST_SHA256=${{ env.GRADLE_DIST_SHA256 }}
          cache-from: type=gha
          push: false
          load: true

      - name: Smoke linux/amd64 image before publication
        run: |
          docker run -d --name janus-release-smoke -p 8080:8080 \
            --read-only --tmpfs /tmp \
            -e MICRONAUT_CONFIG_FILES=/etc/janus/config.toml \
            -e JANUS_MASTER_KEY=ci-release-smoke \
            -v "$(pwd)/deploy/config/config.memory.toml:/etc/janus/config.toml:ro" \
            "$(echo '${{ steps.meta.outputs.tags }}' | head -1)"
          trap 'docker rm -f janus-release-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health; then
              echo
              echo "amd64 image /health ok (attempt $i)"
              exit 0
            fi
            sleep 1
          done
          docker logs janus-release-smoke 2>&1 | tail -40
          exit 1

      - name: Push linux/amd64 tags after smoke
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

  publish-arm64:
    name: Publish linux/arm64 to GHCR (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify-release]
    runs-on: ubuntu-24.04-arm # native arm64 — no QEMU emulation penalty
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (digest-pinned)

      - name: Gradle distribution digest (wrapper integrity build-arg)
        run: |
          test -x scripts/pin-gradle-digest.sh
          sha="$(scripts/pin-gradle-digest.sh --print)"
          echo "GRADLE_DIST_SHA256=$sha" >> "$GITHUB_ENV"

      - name: Image name (lowercased repo)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0 (digest-pinned)

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0 (digest-pinned)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags + labels, arm64-suffixed)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 (digest-pinned)
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern=latest
          flavor: suffix=-arm64,onlatest=true

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2 (digest-pinned)
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GRADLE_DIST_SHA256=${{ env.GRADLE_DIST_SHA256 }}
          cache-from: type=gha
          push: false
          load: true

      - name: Smoke linux/arm64 image before publication
        run: |
          docker run -d --name janus-release-smoke -p 8080:8080 \
            --read-only --tmpfs /tmp \
            -e MICRONAUT_CONFIG_FILES=/etc/janus/config.toml \
            -e JANUS_MASTER_KEY=ci-release-smoke \
            -v "$(pwd)/deploy/config/config.memory.toml:/etc/janus/config.toml:ro" \
            "$(echo '${{ steps.meta.outputs.tags }}' | head -1)"
          trap 'docker rm -f janus-release-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health; then
              echo
              echo "arm64 image /health ok (attempt $i)"
              exit 0
            fi
            sleep 1
          done
          docker logs janus-release-smoke 2>&1 | tail -40
          exit 1

      - name: Push linux/arm64 tags after smoke
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

  publish-manifest:
    name: Merge multi-arch manifest (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-amd64, publish-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0 (digest-pinned)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge arch manifests into multi-arch tags
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${GITHUB_REF_NAME#v}"
          MAJORMINOR="${VERSION%.*}"
          for tag in "$VERSION" "$MAJORMINOR" latest; do
            docker buildx imagetools create               -t "$IMAGE:$tag"               "$IMAGE:$tag-amd64"               "$IMAGE:$tag-arm64"
          done
          docker buildx imagetools inspect "$IMAGE:$VERSION"
