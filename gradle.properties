# Janus build properties
group=io.amscotti.janus
version=0.2.0

# --- Toolchains -----------------------------------------------------------
# Prefer JAVA_HOME (mise sets this when you `mise install` / enter the project).
# Toolchain properties (org.gradle.java.installations.*) are read at Gradle
# STARTUP from gradle.properties / -P / GRADLE_OPTS only — a per-machine fallback
# therefore lives in ~/.gradle/gradle.properties or GRADLE_OPTS, not a repo file
# (see README). A project-local gradle.properties.local is NOT auto-loaded and
# cannot feed toolchain resolution, so none is shipped.
org.gradle.java.installations.fromEnv=JAVA_HOME

# --- Daemon ---------------------------------------------------------------
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache — every task graph (build/nativeCompile/coverage/jmh/
# twoNodeTest/liveTest) stores cleanly; problems fail the build so a plugin
# regression cannot silently degrade to full reconfiguration.
org.gradle.configuration-cache=true

# --- Micronaut ------------------------------------------------------------
# Platform BOM version (io.micronaut.platform:micronaut-platform) — core artifacts
# track it; 5.2.2 is the newest platform BOM as of Oct 2026.
micronaut.version=5.2.2

# --- Test ---------------------------------------------------------------
junitBomVersion=6.1.3
# Architecture rules as unit tests (AGENTS.md module boundaries).
archunitVersion=1.5.1

# --- Store (PostgresCallStore JDBC) --------------------------------------
# HikariCP 7.x + the PostgreSQL driver 42.7.x — janus-store's first
# third-party dependencies (the pool).
hikariVersion=7.1.0
postgresVersion=42.7.14
# Testcontainers for the W41 parity suite (real Postgres; Docker-gated).
testcontainersVersion=2.0.5
