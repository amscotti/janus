# =============================================================================
# Janus compose config — POSTGRES store.
#
# Mount this via JANUS_COMPOSE_CONFIG for a postgres-backed janus (compose
# profile postgres / node2). The path resolves against the compose project dir
# (deploy/) — ./config.postgres.toml would NOT hit this file: Docker would
# bind-mount a freshly created DIRECTORY over /etc/janus/config.toml and the
# boot would fail confusingly. Use the ./config/ prefix:
#     JANUS_COMPOSE_CONFIG=./config/config.postgres.toml \
#       docker compose --profile postgres up -d
#
# [janus.store] type = "postgres" with env-ref'd JDBC creds (env-var-name pattern: the URL
# lives in JANUS_DB_URL, never TOML). FAIL FAST: an unreachable DB (or an
# unresolvable env var) REFUSES boot with a nonzero exit — compose's
# `depends_on: condition: service_healthy` on the postgres service is the
# readiness gate. [janus.limits] window = "fixed" is REQUIRED in postgres mode
# (sliding + postgres is rejected at boot — the fix-2 decision).
# =============================================================================

[micronaut.application]
name = "janus"

[micronaut.server]
port = 8080

[endpoints.all]
enabled = true
sensitive = true

[endpoints.stop]
enabled = false

[endpoints.refresh]
enabled = false

[[janus.model-list]]
name = "deepseek-v4-flash"
provider = "openai-compatible"
api-key-env = "DEEPSEEK_API_KEY"
base-url = "http://fake-upstream:9877"

[janus.keys]
master-key-env = "JANUS_MASTER_KEY"

[janus.pricing]
[[janus.pricing.models]]
name = "deepseek-v4-flash"
input-per-1k = 0.14
output-per-1k = 0.28
default-max-tokens = 4096

[janus.limits]
window = "fixed" # postgres mode is fixed-window only (fix 2)

[janus.store]
type = "postgres"
jdbc-url-env = "JANUS_DB_URL"
user-env = "JANUS_DB_USER"
password-env = "JANUS_DB_PASS"
max-pool-size = 5
retention = 1000
