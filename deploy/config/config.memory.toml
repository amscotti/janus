# =============================================================================
# Janus compose config — MEMORY store default (deploy/docker-compose.yml).
#
# The default mount for the `janus` service: NO [janus.store] section ⇒ the
# in-memory store (behavior byte-identical, zero external dependencies —
# `docker compose up` alone is a complete Janus). [janus.keys] is present so the
# admin smoke (master-keyed /key/generate|list/delete) runs. Hardened posture:
# auth is ON by default — JANUS_MASTER_KEY must resolve (compose env_file ← root
# .env) or the container FAILS FAST. Local experiments declare auth = "off" here.
#
# The model-list points at the compose `fake-upstream` service DNS name (only
# resolvable when the fake-upstream profile is active); with no fake running the
# alias still lists (providers are lazy — only dispatched requests fail).
# Secrets are env-var NAMES, never values (the env-var-name pattern).
# =============================================================================

[micronaut.application]
name = "janus"

[micronaut.server]
port = 8080

[endpoints.all]
enabled = true
sensitive = true

[endpoints.stop]
enabled = false

[endpoints.refresh]
enabled = false

[[janus.model-list]]
name = "deepseek-v4-flash"
provider = "openai-compatible"
api-key-env = "DEEPSEEK_API_KEY"
base-url = "http://fake-upstream:9877"

[janus.keys]
master-key-env = "JANUS_MASTER_KEY"

[janus.pricing]
[[janus.pricing.models]]
name = "deepseek-v4-flash"
input-per-1k = 0.14
output-per-1k = 0.28
default-max-tokens = 4096

[janus.limits]
window = "fixed"
