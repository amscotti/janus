# Cluster compose config — three identical nodes + shared Postgres.
# Fake-upstream base-url is the compose service name. Fixture rates
# (0.14 / 0.28 per 1K) keep the golden 14/12 → 5320 µUSD assertion.

[micronaut.application]
name = "janus"

[micronaut.server]
port = 8080

[endpoints.all]
enabled = true
sensitive = true

[endpoints.stop]
enabled = false

[endpoints.refresh]
enabled = false

[[janus.model-list]]
name = "deepseek-v4-flash"
provider = "openai-compatible"
base-url = "http://fake-upstream:9877"

[janus.keys]
master-key-env = "JANUS_MASTER_KEY"

[janus.privacy]
log-content = false

[janus.pricing]
[[janus.pricing.models]]
name = "deepseek-v4-flash"
input-per-1k = 0.14
output-per-1k = 0.28
default-max-tokens = 4096

[janus.limits]
window = "fixed"
soft-cap-fraction = 0.8

[janus.store]
type = "postgres"
jdbc-url-env = "JANUS_DB_URL"
user-env = "JANUS_DB_USER"
password-env = "JANUS_DB_PASS"
max-pool-size = 5
retention = 1000
