# Cluster compose config — live upstreams. Secrets are env-var NAMES only.
# Official USD-per-1K (vendor per-1M ÷ 1000). Used by the live + agent legs.

[micronaut.application]
name = "janus"

[micronaut.server]
port = 8080

[endpoints.all]
enabled = true
sensitive = true

[endpoints.stop]
enabled = false

[endpoints.refresh]
enabled = false

[janus.keys]
master-key-env = "JANUS_MASTER_KEY"

[janus.privacy]
log-content = false

[janus.providers.deepseek]
wire-format = "openai-compatible"
base-url = "https://api.deepseek.com"
api-key-env = "DEEPSEEK_API_KEY"

[janus.providers.anthropic]
wire-format = "anthropic"
base-url = "https://api.anthropic.com"
api-key-env = "ANTHROPIC_API_KEY"

[janus.providers.openai]
wire-format = "openai-compatible"
base-url = "https://api.openai.com"
api-key-env = "OPENAI_API_KEY"

[janus.providers.deepseek-anthropic]
wire-format = "anthropic"
base-url = "https://api.deepseek.com/anthropic"
api-key-env = "DEEPSEEK_API_KEY"

[janus.providers.xai]
wire-format = "openai-compatible"
base-url = "https://api.x.ai"
api-key-env = "XAI_API_KEY"

[janus.providers.openrouter]
wire-format = "openai-compatible"
base-url = "https://openrouter.ai/api"
api-key-env = "OPENROUTER_API_KEY"

[janus.providers.meta]
wire-format = "openai-compatible"
base-url = "https://api.meta.ai"
api-key-env = "META_API_KEY"

[janus.providers.fireworks]
wire-format = "openai-compatible"
base-url = "https://api.fireworks.ai/inference"
api-key-env = "FIREWORKS_API_KEY"

[janus.providers.groq]
wire-format = "openai-compatible"
base-url = "https://api.groq.com/openai"
api-key-env = "GROQ_API_KEY"

# Perplexity serves a VERSIONLESS endpoint (/chat/completions, no /v1): the base
# ending with /chat/completions is the adapter's full-endpoint opt-out.
[janus.providers.perplexity]
wire-format = "openai-compatible"
base-url = "https://api.perplexity.ai/chat/completions"
api-key-env = "PERPLEXITY_API_KEY"

[janus.providers.gemini]
wire-format = "openai-compatible"
base-url = "https://generativelanguage.googleapis.com/v1beta/openai"
api-key-env = "GEMINI_API_KEY"

