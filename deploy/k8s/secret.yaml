# =============================================================================
# Janus — Secret. PLACEHOLDER VALUES — **MUST EDIT BEFORE APPLY**.
#
# kubectl create secret generic janus-secrets \
#   --from-literal=JANUS_MASTER_KEY='<long-random-secret>' \
#   --from-literal=DEEPSEEK_API_KEY='sk-...' \
#   --from-literal=ANTHROPIC_API_KEY='sk-ant-...' \
#   --from-literal=OPENAI_API_KEY='sk-...' \
#   --from-literal=OPENROUTER_API_KEY='sk-or-...' \
#   --from-literal=XAI_API_KEY='xai-...' \
#   --from-literal=JANUS_DB_URL='jdbc:postgresql://<db-host>:5432/janus' \
#   --from-literal=JANUS_DB_USER='janus' \
#   --from-literal=JANUS_DB_PASS='<db-password>'
#
# The stringData block below exists so `kubectl apply -f deploy/k8s/` is a valid
# dry-run/CI target — the literal values are placeholders and MUST be replaced
# before any real traffic. Prefer not committing this file at all: use
# sealed-secrets (bitnami) or external-secrets (operator) so the plaintext Secret
# never reaches the repo. Default auth = "on": a missing JANUS_MASTER_KEY
# fails the boot. Set it before exposing the gateway.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: janus-secrets
  labels:
    app: janus
type: Opaque
stringData:
  # Admin master key: long random secret. NEVER reuse a provider key.
  JANUS_MASTER_KEY: "change-me-to-a-long-random-master-key"
  # Provider API keys (referenced from config.toml [[janus.model-list]] api-key-env).
  DEEPSEEK_API_KEY: "change-me"
  ANTHROPIC_API_KEY: "change-me"
  OPENAI_API_KEY: "change-me"
  OPENROUTER_API_KEY: "change-me"
  XAI_API_KEY: "change-me"
  # Postgres store (only used when config.toml has [janus.store] type = "postgres").
  # These three pair with the OPTIONAL dev/demo StatefulSet (deploy/k8s/
  # postgres.yaml — the Testcontainers convention janus/janus), so uncommenting
  # [janus.store] in configmap.yaml and applying both works out of the box.
  # Against any real (managed) DB, replace ALL THREE — this is NOT a secret.
  JANUS_DB_URL: "jdbc:postgresql://janus-postgres:5432/janus"
  JANUS_DB_USER: "janus"
  JANUS_DB_PASS: "janus"
