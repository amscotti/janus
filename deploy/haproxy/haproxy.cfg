# HAProxy in front of a three-node Janus cluster.
# Round-robin, HTTP health checks on GET /health (unauthenticated).
# In-flight requests are never migrated: retries apply only to a failed
# connect, matching docs/clustering.md.
global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 10s
    timeout client  330s
    timeout server  330s
    timeout tunnel  330s
    timeout check   3s
    option  http-keep-alive

frontend janus
    bind *:8080
    option forwardfor
    default_backend janus_nodes

backend janus_nodes
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server inter 2s fall 2 rise 1
    # Connect-level failover: with no `retry-on`, `retries` applies ONLY to a
    # connection that never established — no request was delivered, so replaying
    # it onto the next server is safe. That is the failover path during the
    # ~4s httpchk detection window (inter 2s x fall 2) after a node dies:
    # round-robined clients land on a surviving node instead of an immediate
    # 503. A DELIVERED request is never replayed — an application 429/4xx
    # response or an in-flight stream is not re-sent onto another node (that
    # would double-count RPM/budget); taking the dead server out of rotation
    # (httpchk) is the only other retry mechanism, per docs/clustering.md.
    retries 2
    server n1 janus-1:8080 check
    server n2 janus-2:8080 check
    server n3 janus-3:8080 check
