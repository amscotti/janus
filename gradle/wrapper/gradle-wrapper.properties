distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.1-bin.zip
# Integrity (C26): the distribution digest is not hardcoded here — its value
# must come from Gradle's official checksum (never guessed: a wrong digest
# fails every fresh ./gradlew download). CI pins it at runner setup instead,
# before the first wrapper download: ci.yml (build + live-provider jobs) and
# release.yml run scripts/pin-gradle-digest.sh (fetches gradle-9.6.1-bin.zip.sha256
# and appends distributionSha256Sum to the local working copy), docker.yml passes
# the same digest into deploy/Dockerfile as the GRADLE_DIST_SHA256 build-arg.
# Dev machines: run scripts/pin-gradle-digest.sh (cross-checks any existing pin
# and fails on a stale one). To hardcode the pin instead, record the official
# value here:
#   curl -fsSL https://services.gradle.org/distributions/gradle-9.6.1-bin.zip.sha256
# distributionSha256Sum=
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
