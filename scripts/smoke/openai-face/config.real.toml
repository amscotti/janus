# W08 OpenAI-face gate — real-upstream config (env-gated leg, DEEPSEEK_API_KEY).
# Used ONLY when DEEPSEEK_API_KEY is exported; never in CI.
# The runner boots Janus with this config and runs the real-DeepSeek smoke leg;
# a bad-key sub-leg uses a generated config referencing JANUS_SMOKE_BAD_KEY.
# This file is the canonical reference (the runner may substitute the port).

[micronaut.application]
name = "janus"

[micronaut.server]
port = 8080

[janus]
name = "janus"
version = "0.1.0-SNAPSHOT"

[[janus.model-list]]
name = "deepseek-v4-flash"
provider = "deepseek"
api-key-env = "DEEPSEEK_API_KEY"
base-url = "https://api.deepseek.com"

[[janus.model-list]]
name = "deepseek-v4-pro"
provider = "deepseek"
api-key-env = "DEEPSEEK_API_KEY"
base-url = "https://api.deepseek.com"

# Harness posture: this smoke/bench leg deliberately runs WITHOUT auth (the fake
# upstream needs no keys). Production posture: remove this block or set
# auth = "on" plus a master-key-env that resolves — a keyless ON boot now fails fast.
[janus.pricing]
[[janus.pricing.models]]
name = "deepseek-v4-flash"
input-per-1k = 0.00014
output-per-1k = 0.00028
default-max-tokens = 4096

[[janus.pricing.models]]
name = "deepseek-v4-pro"
input-per-1k = 0.000435
output-per-1k = 0.00087
default-max-tokens = 4096

[janus.keys]
auth = "off"
