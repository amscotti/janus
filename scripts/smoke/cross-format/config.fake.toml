# W15 cross-format gate — deterministic fake-upstream config (lives under
# scripts/smoke/cross-format/, NOT the repo root; root config.toml stays the dev-facing
# example — zero production diff).
#
# Boot forms (the runner branches on leg):
#   JVM leg:./gradlew :janus-cli:run --args='--config <ABS>/scripts/smoke/cross-format/config.fake.toml'
#              (JanusCli parses --config → micronaut.config.files; absolute path
#              required — Gradle `run` executes from the module dir, W06 pinned this)
#   Native leg: MICRONAUT_CONFIG_FILES=<ABS>/scripts/smoke/cross-format/config.fake.toml
#              <native>/janus   (the GraalVM image's mainClass is JanusApplication,
#              which does NOT parse --config)
#
# Two model-list entries — the tripwire asserts BOTH aliases appear on /v1/models:
#   deepseek-v4-flash   → fake OpenAI-compatible upstream (ao/oo legs: Anthropic + OpenAI
#                     SDKs → Janus → fake OpenAI wire; base-url omits /v1 — the
#                     adapter appends /v1/chat/completions, W03/W13 rule)
#   claude-3-5-sonnet → fake Anthropic upstream (oa/aa legs: OpenAI + Anthropic SDKs
#                     → Janus → fake /v1/messages; the adapter appends /v1/messages)
# No api-key-env: the fakes ignore auth, so no Authorization/x-api-key is sent (W08
# precedent).

[micronaut.application]
name = "janus"

[micronaut.server]
port = 8080

[janus]
name = "janus"
version = "0.1.0-SNAPSHOT"

[[janus.model-list]]
name = "deepseek-v4-flash"
provider = "deepseek"
base-url = "http://127.0.0.1:9877"

[[janus.model-list]]
name = "claude-3-5-sonnet"
provider = "anthropic"
base-url = "http://127.0.0.1:9878"

# Harness posture: this smoke/bench leg deliberately runs WITHOUT auth (the fake
# upstream needs no keys). Production posture: remove this block or set
# auth = "on" plus a master-key-env that resolves — a keyless ON boot now fails fast.
[janus.keys]
auth = "off"
