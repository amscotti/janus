# W24 routing gate — fairness drill config (scripts/smoke/routing/ only).
#
# strategy = "least-inflight" is the LIVE proof that a non-default strategy is
# config-selectable end-to-end : 100 concurrent SSE streams must interleave the
# two backends (both ≥ 30 of 100), not pile onto one. max-retries = 0 keeps the drill
# single-attempt (retries would not change the pick anyway — least-inflight is the
# attempt-0 pick). Same alias/backends.

[micronaut.application]
name = "janus"

[micronaut.server]
port = 8080

[janus]
name = "janus"
version = "0.1.0-SNAPSHOT"

[[janus.model-list]]
name = "deepseek-v4-flash"
provider = "deepseek"
base-url = "http://127.0.0.1:9877"

[[janus.model-list]]
name = "deepseek-v4-flash"
provider = "openai-compatible"
base-url = "http://127.0.0.1:9878"

[janus.router]
strategy = "least-inflight"
max-retries = 0
backoff-base-ms = 100
backoff-max-ms = 500
jitter = 0
allowed-fails = 3
cooldown-time = 5
breaker-failure-threshold = 5
breaker-window-seconds = 60
breaker-cooldown-seconds = 5

# Harness posture: this smoke/bench leg deliberately runs WITHOUT auth (the fake
# upstream needs no keys). Production posture: remove this block or set
# auth = "on" plus a master-key-env that resolves — a keyless ON boot now fails fast.
[janus.keys]
auth = "off"
