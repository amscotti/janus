# Session-affinity drill config (scripts/smoke/routing/ only — ).
#
# strategy = "session-affinity" is the live proof that the sixth strategy is
# config-selectable end-to-end: requests carrying the same x-janus-session-id
# header must land on ONE backend's upstream counter exclusively (rendezvous
# hash), and requests without the header must spread across both (the hardcoded
# round-robin fallback). max-retries = 0 keeps the drill single-attempt (retries
# walk config order and would blur the stickiness assertion). Same alias/backends
# as config.fairness.toml.

[micronaut.application]
name = "janus"

[micronaut.server]
port = 8080

[janus]
name = "janus"
version = "0.1.0-SNAPSHOT"

[[janus.model-list]]
name = "deepseek-v4-flash"
provider = "deepseek"
base-url = "http://127.0.0.1:9877"

[[janus.model-list]]
name = "deepseek-v4-flash"
provider = "openai-compatible"
base-url = "http://127.0.0.1:9878"

[janus.router]
strategy = "session-affinity"
max-retries = 0
backoff-base-ms = 100
backoff-max-ms = 500
jitter = 0
allowed-fails = 3
cooldown-time = 5
breaker-failure-threshold = 5
breaker-window-seconds = 60
breaker-cooldown-seconds = 5

# Harness posture: this smoke/bench leg deliberately runs WITHOUT auth (the fake
# upstream needs no keys). Production posture: remove this block or set
# auth = "on" plus a master-key-env that resolves — a keyless ON boot now fails fast.
[janus.keys]
auth = "off"
