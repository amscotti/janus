# governance gate — sliding-window variant of config.fake.toml (scripts/smoke/governance/
# only). Identical shape; [janus.limits] window = "sliding" selects the token-bucket
# limiter (TokenBucketRateLimiter) for the sliding-variant RPM/TPM Retry-After leg
# (the m1 documented decision: sliding-mode TPM Retry-After is the conservative
# aligned-window value — see docs/governance.md "Rate limits").
# See config.fake.toml for the boot forms and the shape rationale.

[micronaut.application]
name = "janus"

[micronaut.server]
port = 18080

[endpoints.all]
enabled = true
sensitive = true

[endpoints.stop]
enabled = false

[endpoints.refresh]
enabled = false

[[janus.model-list]]
name = "deepseek-v4-flash"
provider = "openai-compatible"
base-url = "http://127.0.0.1:9877"

[janus.keys]
master-key-env = "JANUS_MASTER_KEY"

[janus.pricing]
[[janus.pricing.models]]
name = "deepseek-v4-flash"
input-per-1k = 0.14
output-per-1k = 0.28
default-max-tokens = 4096

[janus.limits]
window = "sliding"
